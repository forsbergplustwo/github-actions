name: ERB Lint

on:
  workflow_call:
    secrets:
      bundle_token:
        required: true

permissions:
  contents: read

jobs:
  erb-lint:
    runs-on: ubuntu-latest
    env:
      MISE_EXPERIMENTAL: true
    steps:
      - name: Block pull_request_target callers
        uses: $/.github/actions/block-pull-request-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true
      - name: Run ERB lint task
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.bundle_token }}
        run: mise run lint:erb
