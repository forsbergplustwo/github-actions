name: Deploy Shopify Extensions

on:
  workflow_call:
    secrets:
      bundle_token:
        required: true
      shopify_cli_token:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Shopify Extensions
    runs-on: ubuntu-latest
    env:
      MISE_EXPERIMENTAL: true
    steps:
      - name: Block pull_request_target callers
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::Do not call this reusable workflow from pull_request_target. It runs repository code with secrets."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - name: Run mise task deploy:shopify
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.bundle_token }}
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.shopify_cli_token }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: mise run deploy:shopify
