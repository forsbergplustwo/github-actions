name: Prettier

on:
  workflow_call:
    secrets:
      bundle_token:
        required: true

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    env:
      MISE_EXPERIMENTAL: true
    steps:
      - name: Block pull_request_target callers
        uses: $/.github/actions/block-pull-request-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.bundle_token }}
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - name: Run formatter task
        id: prettier
        continue-on-error: true
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.bundle_token }}
        run: mise run lint:js
      - name: Check for modified files
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "prettier_autofixes_found=true" >> "$GITHUB_ENV"
          else
            echo "prettier_autofixes_found=false" >> "$GITHUB_ENV"
          fi
      - name: Commit autofixes
        shell: bash
        if: env.prettier_autofixes_found == 'true'
        run: |
          echo "::group::Committing Prettier fixes"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Prettier autofixes" || echo "No changes to commit"
          git push
          echo "::endgroup::"
