name: Brakeman

on:
  workflow_call:
    secrets:
      bundle_token:
        required: true

permissions:
  contents: read

jobs:
  brakeman:
    runs-on: ubuntu-latest
    env:
      MISE_EXPERIMENTAL: true
    steps:
      - name: Block pull_request_target callers
        uses: $/.github/actions/block-pull-request-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - name: Run security task
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.bundle_token }}
        run: mise run security
